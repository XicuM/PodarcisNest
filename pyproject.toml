[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podarcisnest"
version = "0.1.0"
description = "Multi-User LLM Wiki Server Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "docker>=7.0.0",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
slack = [
    "slack-bolt>=1.18.0",
]
llm = [
    "anthropic>=0.20.0",
    "openai>=1.20.0",
]
all = [
    "slack-bolt>=1.18.0",
    "anthropic>=0.20.0",
    "openai>=1.20.0",
]

[project.scripts]
podarcisnest = "podarcisnest.cli:main"
nest = "podarcisnest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["podarcisnest*"]
exclude = ["data*"]
