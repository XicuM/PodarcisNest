[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podarcislab"
version = "0.1.0"
description = "Multi-User Research Hub, Dynamic Reverse Proxy, and VS Code Web Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "docker>=7.0.0",
]

[project.scripts]
podarcislab = "podarcislab.cli:main"
