<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodarcisNest — Team Research Habitat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-card: rgba(18, 24, 38, 0.75);
      --accent-cyan: #29b8db;
      --accent-purple: #7c3aed;
      --accent-glow: rgba(41, 184, 219, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-glow: rgba(41, 184, 219, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(41, 184, 219, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.12) 0%, transparent 45%);
      overflow: hidden;
    }
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-header { text-align: center; margin-bottom: 32px; }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      box-shadow: 0 0 20px var(--accent-glow);
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 28px;
      color: #ffffff;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 6px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(41, 184, 219, 0.3);
      background: rgba(255, 255, 255, 0.07);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(41, 184, 219, 0.5);
    }
    .footer-note { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(41, 184, 219, 0.15);
      color: var(--accent-cyan);
    }
    .footer-note a { color: var(--accent-cyan); text-decoration: none; }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="brand-header">
      <div class="brand-logo">🦎</div>
      <h1 class="brand-title">PodarcisNest</h1>
      <p class="brand-subtitle">Team Research Habitat & Workspace Hub</p>
    </div>

    {% if error %}
    <div id="error-banner" class="error-banner">
      {{ error }}
    </div>
    {% endif %}

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-user" onclick="switchTab('user')">💻 Researcher</button>
      <button type="button" class="tab-btn" id="tab-admin" onclick="switchTab('admin')">🛡️ Administrator</button>
    </div>

    <!-- User Login Form -->
    <form id="form-user" action="/login/user" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        {% if users %}
        <select id="username-select" class="form-input" style="margin-bottom: 10px;" onchange="if(this.value) document.getElementById('username').value=this.value;">
          <option value="">-- Select Registered Researcher --</option>
          {% for u in users %}
          <option value="{{ u.username }}">{{ u.username }} ({{ u.status }})</option>
          {% endfor %}
        </select>
        {% endif %}
        <input type="text" id="username" name="username" class="form-input" placeholder="e.g. alice" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="user-password">Password</label>
        <input type="password" id="user-password" name="password" class="form-input" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit">Enter Workspace</button>
    </form>

    <!-- Admin Login Form -->
    <form id="form-admin" action="/login/admin" method="POST" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="password">Admin Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Admin Password" required>
      </div>

      <button type="submit" class="btn-submit">Enter Admin Dashboard</button>
    </form>

    <div class="footer-note">
      PodarcisNest Ingress Gateway &bull; Zero-Trust Isolation
    </div>
  </div>

  <script>
    function switchTab(mode) {
      const userTab = document.getElementById('tab-user');
      const adminTab = document.getElementById('tab-admin');
      const userForm = document.getElementById('form-user');
      const adminForm = document.getElementById('form-admin');

      if (mode === 'user') {
        userTab.classList.add('active');
        adminTab.classList.remove('active');
        userForm.style.display = 'block';
        adminForm.style.display = 'none';
      } else {
        adminTab.classList.add('active');
        userTab.classList.remove('active');
        adminForm.style.display = 'block';
        userForm.style.display = 'none';
      }
    }
  </script>
</body>
</html>
